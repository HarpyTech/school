name: Deploy to GCP Cloud Run


on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  GCP_AR_REPOSITORY: ${{ secrets.GCP_AR_REPOSITORY || 'school-management' }}
  CLOUD_RUN_SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME || 'school-management-api' }}
  EMAIL_FEATURE_ENABLED: ${{ secrets.EMAIL_FEATURE_ENABLED || 'false' }}
  IMAGE: ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPOSITORY || 'school-management' }}/${{ secrets.CLOUD_RUN_SERVICE_NAME || 'school-management-api' }}

jobs:

  # ─── Build & Test ────────────────────────────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: school_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -B

      - name: Run Unit Tests
        run: mvn test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/school_test
          SPRING_DATASOURCE_PASSWORD: testpassword
          SPRING_AUTOCONFIGURE_EXCLUDE: >-
            org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,
            org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,
            org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

  # ─── Build Image & Deploy ────────────────────────────────────────────────────
  deploy:
    name: Build Image and Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      # ── 1. Checkout backend ──────────────────────────────────────────────────
      - name: Checkout backend code
        uses: actions/checkout@v4

      # ── 2. Authenticate to Google Cloud via Service Account key ─────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      # ── 3. Set up Cloud SDK ──────────────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── 4. Ensure Artifact Registry repository exists ────────────────────────
      - name: Create Artifact Registry repository (idempotent)
        run: |
          gcloud artifacts repositories describe "${{ env.GCP_AR_REPOSITORY }}" \
            --location="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
          || gcloud artifacts repositories create "${{ env.GCP_AR_REPOSITORY }}" \
            --repository-format=docker \
            --location="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --description="School Management System container images"

      # ── 5. Configure Docker to push to Artifact Registry ────────────────────
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      # ── 6. Set up Docker Buildx for layer caching ────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 7. Build and push Docker image ───────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 8. Deploy to Cloud Run ───────────────────────────────────────────────
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --port=8080
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=10
            --concurrency=80
            --timeout=300
          env_vars: |
            SPRING_PROFILES_ACTIVE=gcp
            DB_HOST=${{ secrets.DB_HOST }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            EMAIL_FEATURE_ENABLED=${{ env.EMAIL_FEATURE_ENABLED }}
            BOOTSTRAP_ADMIN_USERNAME=${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}
            BOOTSTRAP_ADMIN_EMAIL=${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          # Sensitive credentials – sourced from GitHub Secrets and injected as
          # Cloud Run environment variables at deploy time.
          # For production hardening, store these in GCP Secret Manager and
          # reference them via the 'secrets:' parameter instead.
          env_vars_update_strategy: overwrite
          # Note: DB_PASSWORD, JWT_SECRET, and GOOGLE_CLIENT_SECRET are passed
          # separately below via a gcloud update to avoid logging in Actions output.

      # ── 9. Inject sensitive secrets via gcloud (not logged in Actions UI) ────
      - name: Inject sensitive environment variables
        run: |
          gcloud run services update "${{ env.CLOUD_RUN_SERVICE_NAME }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --update-env-vars="DB_PASSWORD=${{ secrets.DB_PASSWORD }},JWT_SECRET=${{ secrets.JWT_SECRET }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},BOOTSTRAP_ADMIN_PASSWORD=${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}"

      # ── 10. Print the service URL ────────────────────────────────────────────
      - name: Print deployed service URL
        run: |
          gcloud run services describe "${{ env.CLOUD_RUN_SERVICE_NAME }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format="value(status.url)"
