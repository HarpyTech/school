# School Management System - Docker Compose
# DB-only stack: Application + SQL Server (Azure SQL compatible)

version: '3.8'

services:

  # ─── Application ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school-management-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: school_management
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD:-YourStrong@2024!}
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    networks:
      - school-network
    # restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── SQL Server (Azure SQL compatible) ─────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: school-sqlserver
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: ${DB_PASSWORD:-YourStrong@2024!}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - school-network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "$$SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── SQL Server DB init (creates schema database) ──────────
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${DB_PASSWORD:-YourStrong@2024!}
    volumes:
      - ./docker/sqlserver/init.sql:/init.sql:ro
    command: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U SA -P $$SA_PASSWORD -i /init.sql -No"
    networks:
      - school-network
    restart: "no"

volumes:
  sqlserver_data:

networks:
  school-network:
    driver: bridge
