spring:
  # ─── DataSource – Azure SQL (SQL Server) ───────────────────────────────────────────────
  datasource:
    url: "jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME:school_management};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30"
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      # Cloud Run instances are ephemeral – keep the pool small to avoid
      # exhausting Cloud SQL max-connections when many revisions are running.
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: SchoolHikariPool-GCP

  # ─── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  # ─── Flyway ───────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  # ─── Disable local-only auto-configurations ───────────────────────────────────
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

# ─── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}        # Cloud Run injects $PORT automatically
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

# ─── App Custom Properties ────────────────────────────────────────────────────
app:
  features:
    email-enabled: ${EMAIL_FEATURE_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    issuer: school-management-system
  cors:
    # In production set this to your Cloud Run service URL or custom domain.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    max-age: 3600
  rate-limit:
    enabled: true
    requests-per-minute: 60
    requests-per-hour: 1000
  upload:
    max-file-size: 10MB
    allowed-types: image/jpeg,image/png,application/pdf
    base-path: /tmp/school-uploads

# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.school.management: INFO
